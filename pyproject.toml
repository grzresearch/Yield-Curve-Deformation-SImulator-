[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yield-curve-simulator"
dynamic = ["version"]
description = "Yield curve deformation simulator with risk metrics"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.4.0"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/grzresearch/Yield-Curve-Deformation-SImulator-"
Dashboard = "https://grzresearch.github.io/Yield-Curve-Deformation-SImulator-/"

[tool.setuptools.dynamic]
version = { attr = "yield_curve.__version__" }

[tool.setuptools.packages.find]
include = ["yield_curve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
